<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện LISP — AutoCAD Toolkit</title>
<link rel="stylesheet" href="css/app.css">
<style>
  pre.code {
    margin: 0; padding: var(--s3) var(--s4); background: var(--fg); color: var(--ink-inv);
    font-family: var(--mono); font-size: 11.5px; line-height: 1.65; border-radius: var(--r);
    overflow-x: auto; white-space: pre; max-height: 320px;
  }
  .lisprow { display: grid; grid-template-columns: 1fr auto; gap: var(--s3); align-items: start; }
  .hashrow { display: grid; grid-template-columns: 128px 1fr; gap: var(--s2) var(--s3); font-size: 12px; }
  .hashrow .hk { color: var(--muted); }
  .hashrow .hv { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
  .cov { display: flex; flex-direction: column; gap: var(--s2); }
  .covopt {
    display: grid; grid-template-columns: 15px 1fr; gap: var(--s3); align-items: start;
    padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r-sm); cursor: pointer;
  }
  .covopt:has(input:checked) { border-color: var(--accent); background: var(--acc-08); }
  .covopt input { position: absolute; opacity: 0; }
  .covopt .rk { width: 13px; height: 13px; margin-top: 3px; border: 1.5px solid var(--border); border-radius: var(--r-pill); }
  .covopt:has(input:checked) .rk { border-color: var(--accent); border-width: 4px; }
  .covopt b { display: block; font-size: 12.5px; font-weight: 590; }
  .covopt span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
</style>
</head>
<body data-screen="lisp" data-acad="on" data-status="5 script · 1 đã duyệt">

<div class="app">
  <header class="titlebar" data-shell="titlebar"></header>

  <div class="body">
    <nav class="rail" data-shell="rail" aria-label="Điều hướng chính"></nav>

    <main class="main">
      <div class="pagehead" data-od-id="lisp-head">
        <div>
          <h1 data-od-id="lisp-title">Thư viện LISP</h1>
          <div class="sub">Script chỉ nạp được sau khi có người đọc và ký duyệt trong app desktop</div>
        </div>
        <div class="actions">
          <button class="btn" id="btn-roots" data-od-id="btn-roots">Thư mục nguồn</button>
        </div>
      </div>

      <div class="banner" style="margin:var(--s4) var(--s5) 0" data-od-id="lisp-policy">
        <span class="bm"></span>
        <span class="bt">Không có nút “chạy ngay”. Mỗi lần nạp cần: <b>đọc source</b> → <b>ký duyệt bằng
        khoá của app desktop</b> → <b>token hai phút</b> → <b>bấm xác nhận trong hộp thoại của AutoCAD</b>.
        Sửa một ký tự trong script là toàn bộ chuỗi này phải làm lại.</span>
      </div>

      <div class="split">
        <div class="scroll">
          <div class="list" id="lisplist" role="listbox" aria-label="Script LISP"></div>
        </div>
        <aside class="detail" id="detail" aria-label="Chi tiết script" data-od-id="lisp-detail"></aside>
      </div>
    </main>
  </div>

  <footer class="statusbar" data-shell="statusbar"></footer>
</div>

<script src="js/app.js"></script>
<script>
/* ============================================================
   LISP approval — the Ed25519 review flow.

   Four things the old single-pane library could not express, and
   which the server rejects the request without:
     · analysisCoverage — how much of the source the reviewer read
     · acknowledgedIncomplete — required when coverage !== "full"
     · a signature produced by the desktop app, over a one-time nonce
     · a 2-minute token, after which the whole review must repeat
   Plus reviewStatus:"stale" the moment sourceHash !== effectiveHash.
   ============================================================ */
(function () {
  "use strict";

  var SCRIPTS = [
    {
      id: "LSP-01", cmd: "CTY-LAYERFIX", name: "Gán đối tượng layer 0 sang A-WALL",
      review: "stale", baseRevision: "s14",
      sourceHash: "9c1f…a730", effectiveHash: "4be2…10dd",
      warnings: [
        { hard: true, t: "Gán <b>mọi</b> đối tượng trên layer 0 vào đúng một layer",
          d: "Script ghi cứng <code>(cons 8 \"A-WALL\")</code>. Bản vẽ hiện có 214 đối tượng trên layer 0 gồm cả trục, chữ và block thiết bị — tất cả sẽ thành A-WALL." },
        { hard: false, t: "Có đường thay thế an toàn hơn",
          d: "Muốn gán theo nhiều đích khác nhau, dùng bộ chọn có guard ở <b>Thông tin bản vẽ</b> — mỗi lần gán là một thao tác chờ duyệt riêng." }
      ],
      code: '(defun c:CTY-LAYERFIX ( / ss i e )\n  (setq ss (ssget "X" \'((8 . "0"))))\n  (if ss\n    (progn\n      (setq i 0)\n      (repeat (sslength ss)\n        (setq e (entget (ssname ss i)))\n        (entmod (subst (cons 8 "A-WALL") (assoc 8 e) e))\n        (setq i (1+ i))))\n    (princ "\\nKhông có đối tượng trên layer 0."))\n  (princ))'
    },
    {
      id: "LSP-02", cmd: "CTY-SETVARS", name: "Đặt biến bản vẽ theo hồ sơ tiêu chuẩn",
      review: "pending", baseRevision: "s09",
      sourceHash: "1a77…be04", effectiveHash: "1a77…be04",
      warnings: [
        { hard: false, t: "Ghi cứng tên style",
          d: "Script đặt <code>CTY-DIM-100</code> và <code>CTY-TEXT</code> trực tiếp. Hồ sơ tiêu chuẩn mới là nguồn đúng — nếu hồ sơ đổi tên style, script này sẽ đặt sai." }
      ],
      code: '(defun c:CTY-SETVARS ()\n  (setvar "INSUNITS" 4)\n  (setvar "LTSCALE" 100)\n  (command "_.-DIMSTYLE" "_R" "CTY-DIM-100")\n  (command "_.-STYLE" "CTY-TEXT" "" 2.5 1 0 "_N" "_N")\n  (princ "\\nĐã áp biến chuẩn."))'
    },
    {
      id: "LSP-03", cmd: "CTY-PURGELAY", name: "Xoá layer rỗng",
      review: "pending", baseRevision: "s03",
      sourceHash: "77ce…2f18", effectiveHash: "77ce…2f18",
      warnings: [
        { hard: true, t: "Xoá hàng loạt, không hỏi từng mục, không hoàn tác",
          d: "Tham số <code>\"_N\"</code> tắt hỏi xác nhận từng layer. Lệnh chạy một mạch trên toàn bộ bảng layer. Trong bản vẽ này có 2 layer rỗng, nhưng script không cho xem trước chúng là layer nào." }
      ],
      code: '(defun c:CTY-PURGELAY ()\n  (command "_.-PURGE" "_LA" "*" "_N")\n  (princ "\\nĐã xoá layer rỗng."))'
    },
    {
      id: "LSP-04", cmd: "CTY-BOMTABLE", name: "Chèn bảng khối lượng",
      review: "blocked", baseRevision: "s07",
      sourceHash: "b302…cc91", effectiveHash: "b302…cc91",
      warnings: [
        { hard: true, t: "Gọi hàm không tồn tại: <code>acad-bom-insert</code>",
          d: "Không có định nghĩa nào của hàm này trong thư mục LISP của dự án. Script sẽ báo lỗi ngay khi chạy. Không duyệt được cho tới khi phụ thuộc được bổ sung." }
      ],
      code: '(defun c:CTY-BOMTABLE ( / pt )\n  (setq pt (getpoint "\\nĐiểm chèn bảng: "))\n  (if pt (acad-bom-insert pt) (princ "\\nĐã huỷ."))\n  (princ))'
    },
    {
      id: "LSP-05", cmd: "CTY-TAGSEQ", name: "Đánh số thiết bị theo tuyến",
      review: "blocked", baseRevision: "s02",
      sourceHash: "5d40…7ab1", effectiveHash: "5d40…7ab1",
      warnings: [
        { hard: true, t: "Gọi 2 hàm không tồn tại: <code>acad-blocks-along</code>, <code>acad-attr-set</code>",
          d: "Cả hai đều không có trong thư mục LISP của dự án." }
      ],
      code: '(defun c:CTY-TAGSEQ ( / pl n )\n  (setq pl (car (entsel "\\nChọn tuyến ống: ")) n 1)\n  (foreach blk (acad-blocks-along pl)\n    (acad-attr-set blk "MA_HIEU" (strcat "P-" (itoa n)))\n    (setq n (1+ n)))\n  (princ))'
    }
  ];

  var REVIEW_LABEL = {
    approved: "đã duyệt", pending: "chưa duyệt",
    stale: "bản duyệt đã cũ", blocked: "thiếu phụ thuộc"
  };
  var REVIEW_OP = { approved: "applied", pending: "draft", stale: "stale", blocked: "rejected" };

  var selected = null;
  var listEl = document.getElementById("lisplist");
  var detail = document.getElementById("detail");
  var tokenTimer = null;

  function paintList() {
    listEl.innerHTML = SCRIPTS.map(function (s) {
      return '<button class="listrow" role="option" data-id="' + s.id + '" aria-selected="' +
        (selected === s.id) + '" style="grid-template-columns:1fr auto" data-od-id="lisp-' + s.id.toLowerCase() + '">' +
        '<span><span class="t">' + s.name + "</span><br>" +
        '<span class="d mono">' + s.id + " · " + s.cmd + "</span></span>" +
        '<span class="row" style="gap:5px">' +
          (s.warnings.some(function (w) { return w.hard; })
            ? '<span class="tag" title="Có cảnh báo nghiêm trọng">!</span>' : "") +
          '<span class="tag opstate" data-op="' + REVIEW_OP[s.review] + '">' + REVIEW_LABEL[s.review] + "</span>" +
        "</span></button>";
    }).join("");
  }

  function paintDetail() {
    var s = SCRIPTS.filter(function (x) { return x.id === selected; })[0];
    if (!s) {
      detail.innerHTML =
        '<div class="statebox" data-state="empty" style="padding-top:var(--s7)">' +
          '<div class="mark">' + App.icon("lisp") + "</div>" +
          "<strong>Chọn một script</strong>" +
          "<p>Đọc toàn bộ source trước khi duyệt. Bạn ký vào đúng nội dung mình đã đọc.</p></div>";
      return;
    }

    var hard = s.warnings.filter(function (w) { return w.hard; });

    detail.innerHTML =
      '<div style="padding:20px;border-bottom:1px solid var(--border);background:var(--bg)">' +
        '<div class="eyebrow">' + s.id + " · " + s.cmd + "</div>" +
        '<h2 style="font-size:16px;font-weight:640;margin-top:6px">' + s.name + "</h2>" +
        '<div class="row" style="margin-top:8px;gap:5px;flex-wrap:wrap">' +
          '<span class="tag opstate" data-op="' + REVIEW_OP[s.review] + '">' + REVIEW_LABEL[s.review] + "</span>" +
          '<span class="tag mono">base ' + s.baseRevision + "</span>" +
        "</div>" +
      "</div>" +
      '<div style="padding:20px;display:flex;flex-direction:column;gap:var(--s4)">' +

        (s.review === "stale"
          ? '<div class="banner" data-tone="hard"><span class="bm"></span><span class="bt">' +
            "<b>Source đã đổi sau khi duyệt.</b> Chữ ký cũ ký vào nội dung khác nội dung hiện tại " +
            "(<code>sourceHash</code> ≠ <code>effectiveHash</code>), nên bản duyệt không còn giá trị. " +
            "Phải đọc lại và duyệt lại từ đầu.</span></div>"
          : "") +

        (hard.length
          ? hard.map(function (w) {
              return '<div class="banner" data-tone="hard"><span class="bm"></span><span class="bt">' +
                "<b>" + w.t + "</b><br>" + w.d + "</span></div>";
            }).join("")
          : "") +

        (s.warnings.filter(function (w) { return !w.hard; }).map(function (w) {
          return '<div class="banner"><span class="bm"></span><span class="bt"><b>' + w.t + "</b><br>" + w.d + "</span></div>";
        }).join("")) +

        '<div><div class="eyebrow" style="margin-bottom:8px">Source đầy đủ · ' +
          s.code.split("\n").length + " dòng</div>" +
          '<pre class="code">' + s.code.replace(/</g, "&lt;") + "</pre></div>" +

        '<div class="hashrow">' +
          '<span class="hk">sourceHash</span><span class="hv">' + s.sourceHash + "</span>" +
          '<span class="hk">effectiveHash</span><span class="hv">' + s.effectiveHash +
            (s.sourceHash !== s.effectiveHash ? " · lệch" : "") + "</span>" +
          '<span class="hk">baseRevision</span><span class="hv">' + s.baseRevision + "</span>" +
        "</div>" +

        (s.review === "blocked"
          ? '<button class="btn" disabled>Không duyệt được — thiếu phụ thuộc</button>' +
            '<p class="hint">Bổ sung hàm còn thiếu vào thư mục LISP của dự án rồi quét lại.</p>'
          : s.review === "approved"
            ? '<div id="load-slot"></div>'
            : '<button class="btn btn--primary" data-act="review">Đọc &amp; duyệt script</button>' +
              '<p class="hint">Việc duyệt phải làm trong app desktop vì chữ ký dùng khoá riêng của máy.</p>') +

      "</div>";

    if (s.review === "approved") paintLoad(s);
  }

  /* ---------- Approval ---------- */
  function openReview(s) {
    var m = App.modal({
      wide: true,
      title: "Duyệt script " + s.cmd,
      sub: "Chữ ký của bạn gắn với đúng nội dung source dưới đây",
      body:
        '<div class="guardstrip">' +
          '<div class="gs-head">Điều kiện duyệt</div>' +
          '<div class="gsrow" data-pass="true"><span class="mk">' + App.icon("tick") + "</span>" +
            '<span class="lbl">Đang chạy trong app desktop<small>Khoá ký nằm trong app desktop. Duyệt từ trình duyệt sẽ bị từ chối 403 <code>desktop_user_review_proof_required</code>.</small></span>' +
            '<span class="src">desktop</span></div>' +
          '<div class="gsrow" data-pass="true"><span class="mk">' + App.icon("tick") + "</span>" +
            '<span class="lbl">Nonce còn hiệu lực<small>Mỗi lần duyệt dùng một nonce, không dùng lại được</small></span>' +
            '<span class="src">nonce</span></div>' +
          '<div class="gsrow" data-pass="' + (s.warnings.some(function (w) { return w.hard; }) ? "false" : "true") + '">' +
            '<span class="mk">' + App.icon("tick") + "</span>" +
            '<span class="lbl">Không có cảnh báo nghiêm trọng<small>' +
              (s.warnings.some(function (w) { return w.hard; })
                ? "Script này có cảnh báo nghiêm trọng — vẫn duyệt được nhưng bạn chịu trách nhiệm"
                : "Không phát hiện vấn đề nghiêm trọng") + "</small></span>" +
            '<span class="src">warnings[]</span></div>' +
        "</div>" +

        '<div><div class="eyebrow" style="margin-bottom:8px">Nội dung bạn đang ký</div>' +
        '<pre class="code">' + s.code.replace(/</g, "&lt;") + "</pre></div>" +

        '<div><div class="eyebrow" style="margin-bottom:8px">Bạn đã đọc tới đâu?</div>' +
        '<div class="cov">' +
          '<label class="covopt"><input type="radio" name="cov" value="full" checked><span class="rk"></span>' +
            "<span><b>Toàn bộ source</b><span>Tôi đã đọc hết và hiểu mọi lệnh trong script.</span></span></label>" +
          '<label class="covopt"><input type="radio" name="cov" value="partial"><span class="rk"></span>' +
            "<span><b>Một phần</b><span>Tôi mới đọc phần chính, chưa đọc hết.</span></span></label>" +
          '<label class="covopt"><input type="radio" name="cov" value="metadata"><span class="rk"></span>' +
            "<span><b>Chỉ metadata</b><span>Tôi chỉ xem tên và mô tả, chưa đọc source.</span></span></label>" +
        "</div></div>" +

        '<div id="ack-wrap" hidden><div class="banner" data-tone="hard"><span class="bm"></span>' +
          '<span class="bt"><label class="check" style="align-items:flex-start">' +
          '<input type="checkbox" id="ack"><span class="box" style="margin-top:2px">' + App.icon("tick") + "</span>" +
          "<span>Tôi hiểu mình <b>chưa đọc hết source</b> và vẫn chịu trách nhiệm cho mọi thay đổi " +
          "mà script này gây ra trên bản vẽ.</span></label></span></div></div>" +

        '<div class="hashrow">' +
          '<span class="hk">proposalHash</span><span class="hv">' + s.sourceHash + "</span>" +
          '<span class="hk">baseRevision</span><span class="hv">' + s.baseRevision + "</span>" +
        "</div>",
      footer:
        '<span class="note">Chữ ký chỉ có giá trị 2 phút và chỉ cho đúng nội dung này.</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn" data-close>Huỷ</button>' +
        '<button class="btn btn--primary" id="do-sign">Ký duyệt</button>'
    });

    var ackWrap = m.el.querySelector("#ack-wrap");
    var ack = m.el.querySelector("#ack");
    var signBtn = m.el.querySelector("#do-sign");

    function syncCov() {
      var v = m.el.querySelector('input[name="cov"]:checked').value;
      var needsAck = v !== "full";
      ackWrap.hidden = !needsAck;
      signBtn.disabled = needsAck && !ack.checked;
    }
    m.el.querySelectorAll('input[name="cov"]').forEach(function (r) {
      r.addEventListener("change", syncCov);
    });
    ack.addEventListener("change", syncCov);
    syncCov();

    signBtn.addEventListener("click", function () {
      signBtn.disabled = true;
      signBtn.innerHTML = '<span class="spin"></span>Đang ký…';
      setTimeout(function () {
        m.close();
        s.review = "approved";
        s.effectiveHash = s.sourceHash;
        paintList();
        paintDetail();
      }, 900);
    });
  }

  /* ---------- Approved: token countdown + SECURELOAD ---------- */
  function paintLoad(s) {
    var slot = document.getElementById("load-slot");
    if (!slot) return;
    var left = 120;

    slot.innerHTML =
      '<div class="guardstrip" style="margin-bottom:var(--s3)">' +
        '<div class="gs-head">Token nạp<span class="n"><span class="countdown" id="cd">' +
          '<span class="ring"></span><span id="cd-t">2:00</span></span></span></div>' +
        '<div class="gsrow" data-pass="true"><span class="mk">' + App.icon("tick") + "</span>" +
          '<span class="lbl">Chữ ký khớp nội dung hiện tại<small>' + s.sourceHash + "</small></span>" +
          '<span class="src">signature</span></div>' +
      "</div>" +
      '<button class="btn btn--primary" data-act="load" data-write>Nạp vào phiên AutoCAD</button>' +
      '<p class="hint" style="margin-top:var(--s2)">Sau khi token hết hạn, phải đọc và duyệt lại từ đầu — ' +
      "không có nút gia hạn.</p>";

    if (tokenTimer) clearInterval(tokenTimer);
    tokenTimer = setInterval(function () {
      var t = document.getElementById("cd-t");
      if (!t) { clearInterval(tokenTimer); return; }
      left -= 1;
      t.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
      if (left <= 0) {
        clearInterval(tokenTimer);
        document.getElementById("cd").dataset.expired = "true";
        t.textContent = "hết hạn";
        var btn = slot.querySelector('[data-act="load"]');
        btn.disabled = true;
        btn.textContent = "Token đã hết hạn";
        slot.insertAdjacentHTML("beforeend",
          '<div class="banner" data-tone="hard" style="margin-top:var(--s3)"><span class="bm"></span>' +
          '<span class="bt"><b>Token 2 phút đã hết hạn.</b> Nonce cũng đã bị đánh dấu đã dùng. ' +
          'Phải duyệt lại.</span><span class="actions"><button class="btn" data-act="review">Duyệt lại</button></span></div>');
      }
    }, 1000);
  }

  /* SECURELOAD: AutoCAD shows its own native dialog and the user must
     click it there. Nothing in this app can click it for them. */
  function doLoad(s) {
    var m = App.modal({
      title: "Chuyển sang AutoCAD",
      sub: "AutoCAD đang hiện hộp thoại SECURELOAD",
      body:
        '<ol class="steps">' +
          '<li data-done="true"><span class="sn">1</span><span class="sb"><b>App đã gửi script đã ký</b>' +
            "<span>Kèm chữ ký, nonce và token còn hiệu lực.</span></span></li>" +
          '<li data-done="active"><span class="sn">2</span><span class="sb">' +
            "<b>Nhìn sang cửa sổ AutoCAD ngay bây giờ</b>" +
            "<span>AutoCAD hiện hộp thoại hỏi có nạp tệp LISP này không. Đây là hộp thoại của AutoCAD, " +
            "app không bấm hộ được và cũng không thấy được nó.</span></span></li>" +
          '<li><span class="sn">3</span><span class="sb"><b>Bấm “Load” trong hộp thoại đó</b>' +
            "<span>Script mới thực sự vào phiên. Lệnh <code>" + s.cmd + "</code> dùng được sau bước này.</span></span></li>" +
        "</ol>" +
        '<div class="statebox" data-state="loading" style="padding:var(--s3) 0">' +
          '<div class="mark"><span class="spin"></span></div>' +
          "<p>Đang chờ phản hồi từ phiên AutoCAD…</p></div>",
      footer: '<span class="spacer"></span><button class="btn" data-close>Đóng</button>'
    });

    setTimeout(function () { m.close(); showSentState(s); }, 2400);
  }

  /* The daemon cannot always confirm the load: state:"sent" means the
     request left the bridge and nothing came back. Telling the user
     "đã nạp xong" here would be a lie. */
  function showSentState(s) {
    App.modal({
      title: "Đã gửi — chưa xác nhận được",
      sub: "state: \"sent\"",
      body:
        '<div class="statebox" data-state="blocked" style="padding:var(--s3) 0">' +
          '<div class="mark">' + App.icon("alert") + "</div>" +
          "<p>Cầu nối đã gửi script sang AutoCAD nhưng không nhận được xác nhận nạp thành công. " +
          "Đây là kết cục bình thường: plugin không báo ngược trạng thái của hộp thoại SECURELOAD.</p>" +
          '<span class="code">Kiểm tra bằng cách gõ <b>' + s.cmd + "</b> trong AutoCAD</span>" +
        "</div>" +
        '<div class="hashrow">' +
          '<span class="hk">Kết cục khác</span><span class="hv">503 plugin chưa nạp · 503 AutoCAD không phản hồi · 502 lỗi cầu nối</span>' +
        "</div>",
      footer:
        '<span class="spacer"></span><button class="btn" data-close>Đóng</button>' +
        '<a class="btn btn--primary" href="settings.html">Kiểm tra kết nối</a>'
    });
  }

  /* ---------- Wiring ---------- */
  listEl.addEventListener("click", function (e) {
    var row = e.target.closest("[data-id]");
    if (!row) return;
    selected = row.dataset.id;
    if (tokenTimer) clearInterval(tokenTimer);
    paintList();
    paintDetail();
  });

  detail.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var s = SCRIPTS.filter(function (x) { return x.id === selected; })[0];
    if (btn.dataset.act === "review") {
      if (s.review === "approved") { s.review = "pending"; paintList(); paintDetail(); }
      openReview(s);
    }
    if (btn.dataset.act === "load") doLoad(s);
  });

  document.getElementById("btn-roots").addEventListener("click", function () {
    App.modal({
      title: "Thư mục nguồn LISP",
      sub: "GET /lisp/roots",
      body:
        '<div class="panel"><div style="padding:var(--s3) var(--s4);border-bottom:1px solid var(--border)">' +
          '<div class="mono" style="font-size:12.5px">~/Acad-Library/lisp</div>' +
          '<div class="hint">Thư mục dự án · 5 tệp · quét 09:41</div></div>' +
        '<div style="padding:var(--s3) var(--s4)">' +
          '<div class="mono" style="font-size:12.5px">~/Acad-Library/cty-lisp</div>' +
          '<div class="hint">Thư mục công ty (chỉ đọc) · 0 tệp</div></div></div>' +
        '<p class="hint" style="margin:0">Thêm thư mục nguồn không tự duyệt script bên trong. ' +
        "Mọi tệp mới đều vào trạng thái <b>chưa duyệt</b>.</p>",
      footer: '<span class="spacer"></span><button class="btn" data-close>Đóng</button>' +
              '<button class="btn btn--primary" data-close>Thêm thư mục</button>'
    });
  });

  paintList();
  paintDetail();
})();
</script>
</body>
</html>
