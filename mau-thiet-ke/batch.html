<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xử lý thư mục — AutoCAD Toolkit</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .batch { display: grid; grid-template-columns: 380px minmax(0, 1fr); min-height: 0; flex: 1; }
  .batch > .setup { border-right: 1px solid var(--border); background: var(--surface); overflow-y: auto; }
  .batch > .run { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .setuppad { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
  .recipe {
    display: grid; grid-template-columns: 15px 1fr; gap: var(--s3); align-items: start;
    padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--bg); width: 100%; text-align: left;
  }
  .recipe:hover { border-color: var(--fg-55); }
  .recipe[aria-pressed="true"] { border-color: var(--accent); background: var(--acc-08); }
  .recipe .rk { width: 13px; height: 13px; margin-top: 3px; border: 1.5px solid var(--border); border-radius: var(--r-pill); }
  .recipe[aria-pressed="true"] .rk { border-color: var(--accent); border-width: 4px; }
  .recipe b { display: block; font-size: 12.5px; font-weight: 590; }
  .recipe span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.45; text-wrap: pretty; }
  .recipe code { font-family: var(--mono); font-size: 11px; }
  .runhead { padding: var(--s4) var(--s5); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  @media (max-width: 1240px) { .batch { grid-template-columns: 320px minmax(0, 1fr); } }
  @media (max-width: 900px)  { .batch { grid-template-columns: 1fr; } .batch > .setup { display: none; } }
</style>
</head>
<body data-screen="batch" data-acad="on" data-status="Chưa chạy mẻ nào">

<div class="app">
  <header class="titlebar" data-shell="titlebar"></header>

  <div class="body">
    <nav class="rail" data-shell="rail" aria-label="Điều hướng chính"></nav>

    <main class="main">
      <div class="pagehead" data-od-id="batch-head">
        <div>
          <h1 data-od-id="batch-title">Xử lý thư mục</h1>
          <div class="sub">Chạy trên tệp <b>đang đóng</b> — không đụng tới phiên AutoCAD bạn đang mở</div>
        </div>
        <div class="actions">
          <button class="btn" data-drawer-open>Nhật ký hoạt động</button>
        </div>
      </div>

      <div class="batch">

        <!-- ── Setup ───────────────────────────────────────────── -->
        <aside class="setup" data-od-id="batch-setup">
          <div class="setuppad">

            <div>
              <div style="font-size:13px;font-weight:640;margin-bottom:var(--s1)">1 · Thư mục nguồn</div>
              <div class="row" style="margin-bottom:var(--s2)">
                <input class="input mono" id="b-dir" value="~/Documents/NM-BinhDuong/KT" aria-label="Thư mục nguồn">
                <button class="btn" id="b-pick">Chọn…</button>
              </div>
              <label class="check"><input type="checkbox" id="b-deep" checked><span class="box"></span>
              <span style="font-size:12.5px">Gồm cả thư mục con</span></label>
            </div>

            <div>
              <div style="font-size:13px;font-weight:640;margin-bottom:var(--s1)">2 · Bộ chạy</div>
              <div class="seg" role="group" aria-label="Bộ chạy" id="b-engine" style="width:100%">
                <button type="button" aria-pressed="true" data-v="headless" style="flex:1">AutoCAD headless</button>
                <button type="button" aria-pressed="false" data-v="offline" style="flex:1">Nhân offline</button>
              </div>
              <p class="hint" id="engine-note" style="margin-top:var(--s2)">
                Chạy AcCoreConsole cho từng tệp. Cần AutoCAD đã cài, nhưng <b>không</b> cần bản vẽ nào đang mở.
              </p>
            </div>

            <div>
              <div style="font-size:13px;font-weight:640;margin-bottom:var(--s2)">3 · Công việc</div>
              <div id="b-recipes" style="display:flex;flex-direction:column;gap:var(--s2)"></div>
              <p class="hint" id="recipe-note" style="margin-top:var(--s3)"></p>
            </div>

            <div class="guardstrip" id="b-guards"></div>

            <button class="btn btn--primary" id="b-run" data-write>Chạy mẻ</button>
          </div>
        </aside>

        <!-- ── Run ─────────────────────────────────────────────── -->
        <div class="run">
          <div class="runhead" data-od-id="batch-runhead">
            <div>
              <div class="eyebrow">Tệp trong thư mục</div>
              <div class="mono" id="b-summary" style="font-size:13px;margin-top:2px">—</div>
            </div>
            <div style="margin-left:auto;min-width:220px" id="b-progress-wrap" hidden>
              <div class="meter" id="b-progress"><i style="width:0%"></i></div>
              <div class="hint mono" id="b-progress-note" style="margin-top:4px">—</div>
            </div>
          </div>

          <div class="scroll">
            <div class="tablewrap">
              <table class="data" id="b-table">
                <thead><tr><th>Tệp</th><th class="n">Kích thước</th><th>Trạng thái</th><th>Kết quả</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <footer class="statusbar" data-shell="statusbar"></footer>
</div>

<script src="js/app.js"></script>
<script>
/* ============================================================
   Batch over a closed folder.

   Two distinct engines, and the difference matters to the user:
   · headless — AcCoreConsole per file. Needs AutoCAD installed.
   · offline  — the Python core. Needs no AutoCAD at all, which is
                the only way to work when AutoCAD is not running.

   Recipe naming discipline: only recipes verified against the
   source are listed by name. The server owns the full list, so the
   UI says so rather than inventing sixteen plausible-looking names.
   ============================================================ */
(function () {
  "use strict";

  var RECIPES = {
    headless: [
      { id: "qa", name: "Kiểm tra toàn vẹn (QA)", verified: true,
        desc: "Chạy <code>AUDIT</code> và dọn layer rỗng trên từng tệp đóng. Đây là nơi duy nhất <code>AUDIT</code> thuộc về — nó kiểm tra toàn vẹn DWG, không phải tiêu chuẩn công ty." }
    ],
    offline: [
      { id: "bom", name: "Bóc tách khối lượng → XLSX", verified: true,
        desc: "Đọc DWG bằng nhân Python, phân loại block bằng <b>biểu thức trên tên block</b>, xuất bảng khối lượng." },
      { id: "layers", name: "Thống kê layer → XLSX", verified: true,
        desc: "Xuất bảng layer và số đối tượng của từng tệp trong thư mục." },
      { id: "title", name: "Đọc khung tên", verified: true,
        desc: "Trích thông tin khung tên của từng bản vẽ ra bảng." },
      { id: "titlefix", name: "Chuẩn hoá khung tên", verified: true,
        desc: "Ghi lại khung tên theo mẫu. <b>Sửa trực tiếp vào tệp</b> — chạy trên bản sao trước." },
      { id: "gemini", name: "Tóm tắt bản vẽ bằng AI", verified: true,
        desc: "Gửi phần mô tả bản vẽ tới mô hình ngôn ngữ để sinh tóm tắt. Không ghi gì vào DWG." }
    ]
  };

  var FILES = [
    { n: "TH-KT-01.dwg", s: "4,2 MB" },
    { n: "TH-KT-02.dwg", s: "2,1 MB" },
    { n: "TH-KT-03.dwg", s: "3,8 MB" },
    { n: "TH-KT-04.dwg", s: "1,4 MB" },
    { n: "HT-CN-11.dwg", s: "3,3 MB" },
    { n: "HT-DI-04.dwg", s: "2,6 MB" },
    { n: "TH-KT-05.dwg", s: "0,9 MB", locked: true }
  ];

  var engine = "headless";
  var recipe = "qa";
  var running = false;

  var recipesEl = document.getElementById("b-recipes");
  var noteEl    = document.getElementById("recipe-note");
  var guardEl   = document.getElementById("b-guards");
  var runEl     = document.getElementById("b-run");
  var tbody     = document.querySelector("#b-table tbody");
  var sumEl     = document.getElementById("b-summary");

  function paintRecipes() {
    var list = RECIPES[engine];
    if (list.map(function (r) { return r.id; }).indexOf(recipe) === -1) recipe = list[0].id;

    recipesEl.innerHTML = list.map(function (r) {
      return '<button class="recipe" data-id="' + r.id + '" aria-pressed="' + (r.id === recipe) + '">' +
        '<span class="rk"></span><span><b>' + r.name + "</b><span>" + r.desc + "</span></span></button>";
    }).join("");

    noteEl.innerHTML = engine === "headless"
      ? 'Máy chủ còn <b>15 công việc khác</b> cho bộ chạy này. Danh sách đầy đủ nạp từ ' +
        '<span class="mono">/api/acad/mep/recipes</span> khi app nối được daemon — ' +
        "mockup chỉ liệt kê công việc đã đối chiếu được với source."
      : "Nhân offline chạy hoàn toàn bằng Python, <b>không cần AutoCAD</b>. Đây là bộ chạy duy nhất " +
        "dùng được khi máy chưa cài AutoCAD hoặc AutoCAD chưa mở.";
  }

  function paintFiles() {
    sumEl.textContent = FILES.length + " tệp · " + document.getElementById("b-dir").value;
    tbody.innerHTML = FILES.map(function (f, i) {
      return '<tr data-i="' + i + '"><td class="mono">' + f.n + '</td><td class="n">' + f.s + "</td>" +
        '<td><span class="tag tag--quiet">chờ</span></td><td class="hint">—</td></tr>';
    }).join("");
  }

  function paintGuards() {
    var acadOff = engine === "headless" && (document.body.dataset.acad === "off" ||
                                            document.body.dataset.acad === "missing");
    var writes = ["titlefix"].indexOf(recipe) > -1;
    var rows = [
      { pass: FILES.length > 0, lbl: "Thư mục có tệp DWG",
        sub: FILES.length + " tệp tìm thấy", src: "source" },
      { pass: !acadOff, lbl: "Bộ chạy sẵn sàng",
        sub: engine === "headless" ? "AcCoreConsole khả dụng" : "Nhân Python khả dụng — không cần AutoCAD",
        src: "engine" },
      { pass: !FILES.some(function (f) { return f.locked; }), lbl: "Không có tệp bị khoá",
        sub: "TH-KT-05.dwg đang bị tiến trình khác giữ — sẽ bị bỏ qua", src: "locked" },
      { pass: !writes, lbl: "Công việc không ghi đè tệp gốc",
        sub: writes ? "titlefix ghi thẳng vào tệp và không hoàn tác được"
                    : "Công việc này chỉ đọc và xuất báo cáo", src: "destructive" }
    ];
    var hard = rows.filter(function (r) { return !r.pass && (r.src === "source" || r.src === "engine"); });
    guardEl.innerHTML =
      '<div class="gs-head">Điều kiện<span class="n">' +
        rows.filter(function (r) { return r.pass; }).length + "/" + rows.length + " đạt</span></div>" +
      rows.map(function (g) {
        return '<div class="gsrow" data-pass="' + (g.pass ? "true" : "false") + '">' +
          '<span class="mk">' + App.icon("tick") + "</span>" +
          '<span class="lbl">' + g.lbl + "<small>" + g.sub + "</small></span>" +
          '<span class="src">' + g.src + "</span></div>";
      }).join("");
    runEl.disabled = hard.length > 0 || running;
  }

  document.getElementById("b-engine").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-v]");
    if (!b) return;
    this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
    b.setAttribute("aria-pressed", "true");
    engine = b.dataset.v;
    document.getElementById("engine-note").innerHTML = engine === "headless"
      ? "Chạy AcCoreConsole cho từng tệp. Cần AutoCAD đã cài, nhưng <b>không</b> cần bản vẽ nào đang mở."
      : "Chạy nhân Python trực tiếp trên tệp DWG. <b>Không cần AutoCAD</b> — dùng được cả khi AutoCAD chưa chạy.";
    paintRecipes(); paintGuards();
  });

  recipesEl.addEventListener("click", function (e) {
    var b = e.target.closest(".recipe");
    if (!b) return;
    recipe = b.dataset.id;
    paintRecipes(); paintGuards();
  });

  document.getElementById("b-pick").addEventListener("click", function () {
    App.toast("Hộp thoại chọn thư mục mở trong app desktop.");
  });
  document.getElementById("b-dir").addEventListener("input", paintFiles);

  /* ---------- Run ---------- */
  runEl.addEventListener("click", function () {
    var r = RECIPES[engine].filter(function (x) { return x.id === recipe; })[0];
    var destructive = recipe === "titlefix";

    App.confirm({
      title: destructive ? "Ghi đè " + FILES.length + " tệp?" : "Chạy mẻ trên " + FILES.length + " tệp?",
      sub: r.name + " · " + document.getElementById("b-dir").value,
      body: destructive
        ? '<div class="banner" data-tone="hard"><span class="bm"></span><span class="bt">' +
          "<b>Công việc này ghi thẳng vào tệp gốc và không hoàn tác được.</b> " +
          "Hệ thống không tạo bản sao lưu tự động. Hãy sao lưu thư mục trước khi chạy.</span></div>"
        : '<p class="hint" style="margin:0">Mẻ chạy nền. Tệp bị khoá sẽ được bỏ qua và ghi rõ trong kết quả.</p>',
      confirmLabel: destructive ? "Tôi đã sao lưu — chạy" : "Chạy mẻ",
      onConfirm: run
    });
  });

  function run() {
    running = true;
    paintGuards();
    runEl.innerHTML = '<span class="spin"></span>Đang chạy…';
    document.getElementById("b-progress-wrap").hidden = false;

    var i = 0;
    var okCount = 0, skipCount = 0;

    (function step() {
      if (i >= FILES.length) {
        running = false;
        runEl.textContent = "Chạy mẻ";
        paintGuards();
        document.getElementById("b-progress-note").textContent =
          okCount + " xong · " + skipCount + " bỏ qua";
        App.setStatus("Mẻ xong: " + okCount + "/" + FILES.length + " tệp");
        return;
      }
      var f = FILES[i];
      var row = tbody.querySelector('tr[data-i="' + i + '"]');
      row.children[2].innerHTML = '<span class="tag opstate" data-op="applying">đang chạy</span>';
      row.children[3].innerHTML = '<span class="skel skel--line" style="width:120px;display:block"></span>';

      setTimeout(function () {
        if (f.locked) {
          skipCount++;
          row.children[2].innerHTML = '<span class="tag opstate" data-op="rejected">bỏ qua</span>';
          row.children[3].innerHTML = '<span class="hint">Tệp bị tiến trình khác giữ — không mở được</span>';
        } else {
          okCount++;
          row.children[2].innerHTML = '<span class="tag opstate" data-op="applied">xong</span>';
          row.children[3].innerHTML = '<span class="hint mono">' + resultFor(f) + "</span>";
        }
        i++;
        var pct = Math.round((i / FILES.length) * 100);
        document.querySelector("#b-progress i").style.width = pct + "%";
        document.getElementById("b-progress-note").textContent = i + "/" + FILES.length + " tệp · " + pct + "%";
        step();
      }, 520);
    })();
  }

  function resultFor(f) {
    return {
      qa:       "0 lỗi toàn vẹn · dọn 2 layer rỗng",
      bom:      "xuất " + f.n.replace(".dwg", ".xlsx"),
      layers:   "7 layer · 908 đối tượng",
      title:    "đọc được khung tên A1",
      titlefix: "đã ghi lại khung tên",
      gemini:   "đã sinh tóm tắt 6 dòng"
    }[recipe] || "xong";
  }

  paintRecipes();
  paintFiles();
  paintGuards();
})();
</script>
</body>
</html>
