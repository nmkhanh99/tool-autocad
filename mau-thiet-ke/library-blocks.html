<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện block — AutoCAD Toolkit</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .blockgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--s4); }
  .blockcard {
    border: 1px solid var(--border); border-radius: var(--r); background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden; text-align: left;
  }
  .blockcard:hover { border-color: var(--fg-55); }
  .blockcard[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--acc-14); }
  /* No fabricated geometry preview: the block service does not render
     thumbnails, so the tile shows the definition name, not a drawing
     that would imply the server knows what the block looks like. */
  .blockcard .prev {
    height: 96px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: grid; place-items: center; gap: 4px; padding: var(--s3); text-align: center;
  }
  .blockcard .prev .gl {
    font-family: var(--mono); font-size: 11px; color: var(--fg-55); letter-spacing: .02em;
    overflow-wrap: anywhere; line-height: 1.4;
  }
  .blockcard .prev .np { font-size: 10px; color: var(--muted); }
  .blockcard .meta { padding: var(--s3); display: flex; flex-direction: column; gap: 5px; }
  .blockcard .n2 { font-size: 13px; font-weight: 590; }
  .srcrow { display: grid; grid-template-columns: 1fr auto; gap: var(--s3); align-items: center;
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); }
  .srcrow:last-child { border-bottom: 0; }
</style>
</head>
<body data-screen="blocks" data-acad="on" data-status="Thư viện block · 8 định nghĩa">

<div class="app">
  <header class="titlebar" data-shell="titlebar"></header>

  <div class="body">
    <nav class="rail" data-shell="rail" aria-label="Điều hướng chính"></nav>

    <main class="main">
      <div class="pagehead" data-od-id="blocks-head">
        <div>
          <h1 data-od-id="blocks-title">Thư viện block</h1>
          <div class="sub">Định nghĩa block dùng chung · <span class="mono">/blocks/sources · /scan · /create · /sync</span></div>
        </div>
        <div class="actions">
          <button class="btn" id="btn-sources" data-od-id="btn-sources">Nguồn thư viện</button>
          <button class="btn" id="btn-create" data-write data-od-id="btn-create">Tạo từ bộ chọn</button>
        </div>
      </div>

      <div class="filterbar" data-od-id="blocks-filters">
        <div class="searchfield" style="width:260px">
          <span data-ic="search"></span>
          <input class="input" id="q" placeholder="Tìm theo tên định nghĩa" aria-label="Tìm block">
        </div>
        <select class="select" id="f-sync" style="width:200px" aria-label="Lọc theo đồng bộ">
          <option value="">Mọi trạng thái đồng bộ</option>
          <option value="ok">Khớp thư viện</option>
          <option value="outdated">Bản vẽ dùng bản cũ</option>
          <option value="local">Chỉ có trong bản vẽ</option>
        </select>
        <button class="btn" id="btn-scan" style="margin-left:auto">Quét lại nguồn</button>
        <span class="tag tag--quiet mono" id="libinfo">—</span>
      </div>

      <div class="split">
        <div class="scroll">
          <div class="pad">
            <div class="blockgrid" id="blockgrid"></div>
            <div class="statebox" id="lib-empty" hidden data-state="empty">
              <div class="mark" data-ic-mark="library"></div>
              <strong>Không tìm thấy định nghĩa nào</strong>
              <p>Thử từ khoá khác, hoặc quét lại nguồn thư viện.</p>
            </div>
          </div>
        </div>

        <aside class="detail" id="detail" aria-label="Chi tiết block" data-od-id="blocks-detail"></aside>
      </div>
    </main>
  </div>

  <footer class="statusbar" data-shell="statusbar"></footer>
</div>

<script src="js/app.js"></script>
<script>
(function () {
  "use strict";

  document.querySelectorAll('[data-ic="search"]').forEach(function (el) { el.outerHTML = App.icon("search"); });
  var mk = document.querySelector('[data-ic-mark="library"]');
  if (mk) mk.innerHTML = App.icon("library");

  var SOURCES = [
    { path: "~/Acad-Library/blocks", kind: "Thư mục dự án", n: 6, scanned: "09:41 hôm nay" },
    { path: "~/Acad-Library/cty-chuan", kind: "Thư mục công ty (chỉ đọc)", n: 2, scanned: "hôm qua 17:02" }
  ];

  /* Fields are exactly what /blocks returns: definition name, source,
     sync status against the library, and how many references the open
     drawing holds. No size and no rendered preview — neither exists. */
  var BLOCKS = [
    { id: "BOM-PUMP",  name: "Bơm ly tâm",        src: "~/Acad-Library/blocks", sync: "ok",       rev: "b12", used: 2 },
    { id: "BOM-VALVE", name: "Van chặn",          src: "~/Acad-Library/blocks", sync: "ok",       rev: "b09", used: 4 },
    { id: "BOM-ELBOW", name: "Co 90°",            src: "~/Acad-Library/blocks", sync: "outdated", rev: "b14", used: 14 },
    { id: "BOM-TEE",   name: "Tê chia dòng",      src: "~/Acad-Library/blocks", sync: "ok",       rev: "b07", used: 6 },
    { id: "BOM-PANEL", name: "Tủ điện phân phối", src: "~/Acad-Library/blocks", sync: "ok",       rev: "b03", used: 1 },
    { id: "BOM-TANK",  name: "Bể chứa",           src: "~/Acad-Library/blocks", sync: "local",    rev: "—",   used: 1 },
    { id: "CTY-TITLE", name: "Khung tên A1",      src: "~/Acad-Library/cty-chuan", sync: "ok",    rev: "b21", used: 1 },
    { id: "CTY-GRID",  name: "Ký hiệu trục",      src: "~/Acad-Library/cty-chuan", sync: "ok",    rev: "b05", used: 6 }
  ];

  var SYNC_LABEL = { ok: "khớp thư viện", outdated: "bản vẽ dùng bản cũ", local: "chỉ có trong bản vẽ" };
  var SYNC_OP    = { ok: "applied", outdated: "stale", local: "draft" };

  var selected = null;
  var q = document.getElementById("q");
  var fSync = document.getElementById("f-sync");
  var grid = document.getElementById("blockgrid");
  var detail = document.getElementById("detail");

  function list() {
    var v = q.value.trim().toLowerCase();
    return BLOCKS.filter(function (b) {
      var hit = !v || (b.id + " " + b.name).toLowerCase().indexOf(v) > -1;
      return hit && (!fSync.value || b.sync === fSync.value);
    });
  }

  function paint() {
    var items = list();
    document.getElementById("lib-empty").hidden = items.length > 0;
    document.getElementById("libinfo").textContent = items.length + " định nghĩa";

    grid.innerHTML = items.map(function (b) {
      return '<button class="blockcard" data-id="' + b.id + '" aria-selected="' + (selected === b.id) +
        '" data-od-id="block-' + b.id.toLowerCase() + '">' +
        '<span class="prev"><span class="gl">' + b.id + "</span>" +
        '<span class="np">chưa có ảnh xem trước</span></span>' +
        '<span class="meta"><span class="n2">' + b.name + "</span>" +
        '<span class="row" style="gap:5px;flex-wrap:wrap">' +
          '<span class="tag opstate" data-op="' + SYNC_OP[b.sync] + '">' + SYNC_LABEL[b.sync] + "</span>" +
          '<span class="tag tag--quiet mono">' + b.used + " lần</span>" +
        "</span></span></button>";
    }).join("");

    paintDetail();
  }

  function paintDetail() {
    var b = BLOCKS.filter(function (x) { return x.id === selected; })[0];
    if (!b) {
      detail.innerHTML =
        '<div class="statebox" data-state="empty" style="padding-top:var(--s7)">' +
          '<div class="mark">' + App.icon("library") + "</div>" +
          "<strong>Chọn một định nghĩa</strong>" +
          "<p>Xem nguồn, trạng thái đồng bộ và chèn vào bản vẽ đang mở.</p></div>";
      return;
    }

    detail.innerHTML =
      '<div style="padding:20px;border-bottom:1px solid var(--border);background:var(--bg)">' +
        '<div class="eyebrow">Định nghĩa block</div>' +
        '<h2 style="font-size:16px;font-weight:640;margin-top:6px">' + b.name + "</h2>" +
        '<div class="mono" style="font-size:11.5px;color:var(--muted);margin-top:4px">' + b.id + "</div>" +
      "</div>" +
      '<div style="padding:20px;display:flex;flex-direction:column;gap:var(--s4)">' +

        '<div class="statebox" data-state="empty" style="padding:var(--s5) var(--s3);border:1px dashed var(--border);border-radius:var(--r)">' +
          '<span class="mono" style="font-size:12px;color:var(--fg-55)">' + b.id + "</span>" +
          '<p style="font-size:11.5px">Dịch vụ thư viện không sinh ảnh xem trước. Muốn xem hình dạng thật ' +
          "phải chèn vào bản vẽ hoặc mở tệp nguồn trong AutoCAD.</p></div>" +

        '<dl class="props" style="border:1px solid var(--border);border-radius:var(--r);background:var(--bg);overflow:hidden">' +
          "<dt>Nguồn</dt><dd>" + b.src + "</dd>" +
          "<dt>Bản thư viện</dt><dd>" + b.rev + "</dd>" +
          "<dt>Đồng bộ</dt><dd>" + SYNC_LABEL[b.sync] + "</dd>" +
          "<dt>Trong bản vẽ</dt><dd>" + b.used + " lần chèn</dd>" +
        "</dl>" +

        (b.sync === "outdated"
          ? '<div class="banner" data-tone="hard"><span class="bm"></span><span class="bt">' +
            "<b>Bản vẽ đang dùng định nghĩa cũ.</b> Chèn thêm sẽ tiếp tục dùng bản cũ trong bản vẽ, " +
            "không tự cập nhật. Muốn cập nhật phải đồng bộ định nghĩa — thao tác này sửa <b>mọi</b> " +
            "lần chèn đang có.</span>" +
            '<span class="actions"><button class="btn" data-act="sync" data-write>Đồng bộ định nghĩa</button></span></div>'
          : "") +

        (b.sync === "local"
          ? '<div class="banner"><span class="bm"></span><span class="bt">Định nghĩa này chỉ tồn tại trong ' +
            "bản vẽ, chưa có trong nguồn thư viện. Đưa vào thư viện để dùng lại ở bản vẽ khác.</span>" +
            '<span class="actions"><button class="btn" data-act="promote">Đưa vào thư viện</button></span></div>'
          : "") +

        '<button class="btn btn--primary" data-act="ins" data-write>Chèn vào bản vẽ</button>' +
        '<p class="hint">AutoCAD sẽ hỏi điểm chèn <b>bên trong AutoCAD</b>. Sau khi bấm nút này bạn phải ' +
        "chuyển sang cửa sổ AutoCAD để chỉ điểm — không chỉ được trên khung xem web.</p>" +
      "</div>";
  }

  grid.addEventListener("click", function (e) {
    var c = e.target.closest("[data-id]");
    if (!c) return;
    selected = selected === c.dataset.id ? null : c.dataset.id;
    paint();
  });

  detail.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var b = BLOCKS.filter(function (x) { return x.id === selected; })[0];
    if (btn.dataset.act === "ins") return doInsert(b);
    if (btn.dataset.act === "sync") return doSync(b);
    if (btn.dataset.act === "promote") return App.toast("Đã thêm " + b.id + " vào nguồn thư viện dự án.");
  });

  /* /blocks/insert has three outcomes and the mockup must be able to
     show all three: clean success, a name conflict, and the quiet
     "succeeded but the definition in the drawing is now stale" case. */
  function doInsert(b) {
    App.confirm({
      title: "Chèn " + b.id + " vào TH-KT-01?",
      sub: "Sau khi xác nhận, hãy chuyển sang AutoCAD để chỉ điểm chèn",
      body:
        '<ol class="steps">' +
          '<li data-done="active"><span class="sn">1</span><span class="sb"><b>Xác nhận ở đây</b>' +
            "<span>App gửi yêu cầu chèn tới phiên AutoCAD.</span></span></li>" +
          '<li><span class="sn">2</span><span class="sb"><b>Chuyển sang cửa sổ AutoCAD</b>' +
            "<span>AutoCAD hiện dấu nhắc “Điểm chèn:”. App không chỉ điểm hộ được.</span></span></li>" +
          '<li><span class="sn">3</span><span class="sb"><b>Nhấp điểm trong bản vẽ</b>' +
            "<span>Block được chèn tại đó. Thao tác chèn tính là một lần ghi và không hoàn tác từ app.</span></span></li>" +
        "</ol>" +
        '<p class="hint" style="margin:0">Lệnh chèn có thể mất tới <b>120 giây</b> nếu AutoCAD phải nạp ' +
        "định nghĩa lần đầu.</p>",
      confirmLabel: "Gửi lệnh chèn",
      onConfirm: function () { runInsert(b); }
    });
  }

  function runInsert(b) {
    App.setStatus("Đang chèn " + b.id + " — chuyển sang AutoCAD để chỉ điểm");
    var m = App.modal({
      title: "Chuyển sang AutoCAD",
      sub: "AutoCAD đang chờ bạn chỉ điểm chèn",
      body:
        '<div class="statebox" data-state="loading" style="padding:var(--s4) 0">' +
          '<div class="mark"><span class="spin"></span></div>' +
          "<strong>Đang chờ điểm chèn</strong>" +
          "<p>Cửa sổ AutoCAD đang hiện dấu nhắc <code>Điểm chèn:</code>. Nhấp một điểm trong bản vẽ để hoàn tất.</p>" +
        "</div>",
      footer: '<span class="spacer"></span><button class="btn" data-close>Huỷ lệnh</button>'
    });

    setTimeout(function () {
      m.close();
      /* BOM-ELBOW is the outdated one, so it demonstrates the degraded
         success path rather than a clean one. */
      if (b.sync === "outdated") return insertDegraded(b);
      if (b.id === "BOM-TANK") return insertConflict(b);
      b.used += 1;
      paint();
      App.toast("Đã chèn " + b.id + " vào TH-KT-01.");
      App.setStatus("Đã chèn " + b.id);
    }, 2200);
  }

  function insertConflict(b) {
    App.modal({
      title: "Trùng tên định nghĩa",
      sub: "POST /blocks/insert · BlockLibraryConflictError",
      body:
        '<div class="statebox" data-state="blocked" style="padding:var(--s3) 0">' +
          '<div class="mark">' + App.icon("alert") + "</div>" +
          "<p>Bản vẽ đã có một định nghĩa tên <b>" + b.id + "</b> nhưng nội dung khác bản thư viện. " +
          "AutoCAD không cho hai định nghĩa trùng tên, và ghi đè sẽ đổi <b>mọi</b> lần chèn đang có trong bản vẽ.</p>" +
          '<span class="code">409 · BlockLibraryConflictError</span>' +
        "</div>",
      footer:
        '<span class="note">Không có lựa chọn “giữ cả hai” — tên định nghĩa là duy nhất trong bản vẽ.</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn" data-close>Huỷ</button>' +
        '<button class="btn btn--primary" data-close>Ghi đè định nghĩa</button>'
    });
  }

  function insertDegraded(b) {
    b.used += 1;
    paint();
    App.modal({
      title: "Đã chèn, nhưng dùng định nghĩa cũ",
      sub: "syncStatus: \"outdated\"",
      body:
        '<div class="banner" data-tone="hard"><span class="bm"></span><span class="bt">' +
        "Lần chèn đã thành công, nhưng bản vẽ giữ định nghĩa <b>" + b.rev + "</b> cũ hơn bản trong thư viện. " +
        "AutoCAD luôn ưu tiên định nghĩa đã có trong bản vẽ.</span></div>" +
        '<p class="hint" style="margin:0">Muốn dùng bản mới phải đồng bộ định nghĩa — thao tác đó sửa mọi ' +
        "lần chèn hiện có, nên nó đi qua hàng chờ duyệt.</p>",
      footer:
        '<span class="spacer"></span><button class="btn" data-close>Để sau</button>' +
        '<button class="btn btn--primary" data-close data-sync-now>Đồng bộ định nghĩa</button>'
    });
  }

  function doSync(b) {
    var list = App.staged();
    list.unshift({
      id: "op_" + Math.random().toString(16).slice(2, 6),
      verb: "Đồng bộ định nghĩa block",
      subject: b.id + " → bản thư viện " + b.rev + " · ảnh hưởng " + b.used + " lần chèn",
      doc: "TH-KT-01", rev: "r48", from: "library", state: "ready", at: "—"
    });
    App.saveStaged(list);
    App.modal({
      title: "Đã tạo thao tác chờ duyệt",
      sub: "Đồng bộ " + b.id,
      body: '<div class="banner"><span class="bm"></span><span class="bt">Bản vẽ <b>chưa thay đổi</b>. ' +
            "Vì thao tác này sửa cả " + b.used + " lần chèn đang có, nó phải được xác nhận trong <b>Thay đổi</b>.</span></div>",
      footer: '<span class="spacer"></span><button class="btn" data-close>Ở lại đây</button>' +
              '<a class="btn btn--primary" href="changes.html">Xem thay đổi</a>'
    });
  }

  /* ---------- Toolbar ---------- */
  document.getElementById("btn-sources").addEventListener("click", function () {
    App.modal({
      title: "Nguồn thư viện block",
      sub: "GET /blocks/sources",
      body: '<div class="panel">' + SOURCES.map(function (s) {
          return '<div class="srcrow"><div><div class="mono" style="font-size:12.5px">' + s.path + "</div>" +
            '<div class="hint">' + s.kind + " · quét lần cuối " + s.scanned + "</div></div>" +
            '<span class="tag mono">' + s.n + " block</span></div>";
        }).join("") + "</div>",
      footer: '<span class="spacer"></span><button class="btn" data-close>Đóng</button>' +
              '<button class="btn btn--primary" data-close>Thêm thư mục nguồn</button>'
    });
  });

  document.getElementById("btn-scan").addEventListener("click", function () {
    var b = this;
    b.disabled = true;
    b.innerHTML = '<span class="spin"></span>Đang quét…';
    setTimeout(function () {
      b.disabled = false;
      b.textContent = "Quét lại nguồn";
      App.toast("Đã quét 2 nguồn · 8 định nghĩa · không có thay đổi.");
    }, 1400);
  });

  /* /blocks/create builds a definition out of the current AutoCAD
     selection, so it depends on a selection that only exists there. */
  document.getElementById("btn-create").addEventListener("click", function () {
    App.modal({
      title: "Tạo block từ bộ chọn",
      sub: "POST /blocks/create",
      body:
        '<div class="guardstrip"><div class="gs-head">Điều kiện</div>' +
          '<div class="gsrow" data-pass="false"><span class="mk"></span>' +
            '<span class="lbl">Có bộ chọn trong AutoCAD<small>Bộ chọn hiện rỗng — chọn đối tượng ngay trong AutoCAD rồi mở lại hộp thoại này</small></span>' +
            '<span class="src">selection</span></div>' +
          '<div class="gsrow" data-pass="true"><span class="mk">' + App.icon("tick") + "</span>" +
            '<span class="lbl">Nguồn thư viện ghi được<small>~/Acad-Library/blocks</small></span>' +
            '<span class="src">source</span></div>' +
        "</div>" +
        '<div class="formgrid">' +
          '<div class="lb">Tên định nghĩa</div><div class="fd"><input class="input mono" placeholder="VD: BOM-STRAINER"></div>' +
          '<div class="lb">Điểm gốc<small>Chọn trong AutoCAD</small></div><div class="fd"><input class="input mono" value="chưa chọn" disabled></div>' +
        "</div>",
      footer:
        '<span class="note">Bộ chọn chỉ tồn tại trong AutoCAD — app không tạo được bộ chọn thay bạn.</span>' +
        '<span class="spacer"></span><button class="btn" data-close>Đóng</button>' +
        '<button class="btn btn--primary" disabled>Tạo block</button>'
    });
  });

  q.addEventListener("input", paint);
  fSync.addEventListener("change", paint);
  paint();
})();
</script>
</body>
</html>
