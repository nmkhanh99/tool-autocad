<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thay đổi chờ duyệt — AutoCAD Toolkit</title>
<link rel="stylesheet" href="css/app.css">
<style>
  /* Master list + proposal sheet. The sheet is the widest column
     because the subject list is what the user actually reads before
     agreeing to a write. */
  .ops { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; flex: 1; }
  .ops > .list-pane { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .ops > .sheet { min-width: 0; overflow-y: auto; }
  .oprow { display: grid; grid-template-columns: 1fr; gap: 6px; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); text-align: left; width: 100%; }
  .oprow:hover { background: var(--fg-04); }
  .oprow[aria-selected="true"] { background: var(--bg); box-shadow: inset 2px 0 0 var(--accent); }
  .oprow .verb { font-size: 13px; font-weight: 590; }
  .oprow .subj { font-size: 12px; color: var(--muted); line-height: 1.45; text-wrap: pretty; }
  .oprow .meta { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .sheetpad { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); max-width: 900px; }
  .subjcount { display: flex; align-items: baseline; gap: var(--s2); }
  .subjcount b { font-family: var(--mono); font-size: 18px; font-weight: 500; }
  @media (max-width: 1240px) { .ops { grid-template-columns: 260px minmax(0, 1fr); } }
  @media (max-width: 900px)  { .ops { grid-template-columns: 1fr; } .ops > .list-pane { display: none; } }
</style>
</head>
<body data-screen="changes" data-acad="on" data-status="2 thao tác chờ xác nhận">

<div class="app">
  <header class="titlebar" data-shell="titlebar"></header>

  <div class="body">
    <nav class="rail" data-shell="rail" aria-label="Điều hướng chính"></nav>

    <main class="main">
      <div class="pagehead" data-od-id="changes-head">
        <div>
          <h1 data-od-id="changes-title">Thay đổi chờ duyệt</h1>
          <div class="sub">Mọi thao tác ghi vào DWG dừng lại ở đây trước khi chạm vào bản vẽ</div>
        </div>
        <div class="actions">
          <a class="btn" href="drawing-info.html" data-od-id="changes-reload">Đọc lại bản vẽ</a>
        </div>
      </div>

      <div class="ops">

        <!-- ── Master list ───────────────────────────────────────── -->
        <div class="list-pane" data-od-id="op-list">
          <div class="filterbar" style="padding:var(--s2) var(--s3)">
            <div class="searchfield" style="flex:1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg>
              <input class="input" id="op-search" placeholder="Lọc thao tác" aria-label="Lọc thao tác">
            </div>
          </div>
          <div class="scroll" id="op-rows" role="listbox" aria-label="Thao tác đã chuẩn bị"></div>
        </div>

        <!-- ── Proposal sheet ────────────────────────────────────── -->
        <div class="sheet" id="op-sheet"></div>
      </div>
    </main>
  </div>

  <footer class="statusbar" data-shell="statusbar"></footer>
</div>

<script src="js/app.js"></script>
<script>
/* ============================================================
   Staged-operation state machine.

   Contract taken from the daemon:
   · /selection/prepare returns an op id. Nothing is written yet.
   · /operations/:id/apply THROWS unless body.confirmed === true.
   · /operations/:id/reject drops it.
   · There is no undo — no journal, no inverse-op, no endpoint.
     The confirm sheet is therefore the last reversible moment,
     which is why it lists every subject before the button.
   · An op whose baseRevision no longer matches the drawing is
     dead: the server self-cancels it. The UI must not offer a
     retry on the same id, only "chuẩn bị lại".
   ============================================================ */
(function () {
  "use strict";

  var DOC_REV = "r48";   // current revision of TH-KT-01 per /docs

  /* Per-op detail. The master list lives in App.staged() so the
     titlebar chip and this screen never disagree. */
  var DETAIL = {
    op_7f31: {
      endpoint: "POST /selection/prepare → /operations/op_7f31/apply",
      action: "move-to-layer",
      origin: "Trợ lý AI · phiên 10:12",
      base: "r48",
      guards: [
        { pass: true,  lbl: "Bản vẽ đích còn mở",        sub: "TH-KT-01 · /docs", src: "quiescent" },
        { pass: true,  lbl: "Revision khớp bản chuẩn bị", sub: "base r48 = hiện tại r48", src: "baseRevision" },
        { pass: true,  lbl: "Bản vẽ ghi được",            sub: "dbmod = 1, không read-only", src: "drawing_read_only" },
        { pass: true,  lbl: "Layer đích tồn tại",         sub: "A-WALL có trong layer table", src: "layer_not_found" },
        { pass: true,  lbl: "AutoCAD đang rảnh",          sub: "quiescent = true", src: "target_busy" }
      ],
      subjects: [
        { h: "2A4F", t: "LWPOLYLINE", l: "0" }, { h: "2A51", t: "LWPOLYLINE", l: "0" },
        { h: "2A53", t: "LINE",       l: "0" }, { h: "2A58", t: "LINE",       l: "0" },
        { h: "2A5C", t: "LWPOLYLINE", l: "0" }, { h: "2A61", t: "LINE",       l: "0" },
        { h: "2A66", t: "MTEXT",      l: "0" }, { h: "2A6A", t: "LINE",       l: "0" }
      ],
      total: 214,
      diff: [
        { d: "mod", k: "Layer đối tượng", before: "0", after: "A-WALL", n: "214 đối tượng" }
      ],
      warn: null
    },
    op_7f2e: {
      endpoint: "POST /standards/apply",
      action: "sync-layers",
      origin: "Kiểm tra · phiên quét scan_5c11",
      base: "r48",
      guards: [
        { pass: true,  lbl: "Bản vẽ đích còn mở",  sub: "TH-KT-01 · /docs", src: "quiescent" },
        { pass: true,  lbl: "Revision khớp",       sub: "base r48 = hiện tại r48", src: "drawing_stale" },
        { pass: false, lbl: "Hồ sơ tiêu chuẩn chưa đổi từ lúc quét",
          sub: "Hồ sơ cty-2024 đã lên v12 sau khi quét ở v11 — phải quét lại", src: "profile_stale" },
        { pass: true,  lbl: "Bản vẽ ghi được",     sub: "dbmod = 1", src: "drawing_read_only" }
      ],
      subjects: [
        { h: "—", t: "LAYER", l: "A-WALL" }, { h: "—", t: "LAYER", l: "A-DOOR" },
        { h: "—", t: "LAYER", l: "P-PIPE" }, { h: "—", t: "LAYER", l: "A-GRID" },
        { h: "—", t: "LAYER", l: "A-TEXT" }
      ],
      total: 8,
      diff: [
        { d: "add", k: "Tạo layer",     before: "—",          after: "A-DOOR · màu 3 · Continuous", n: "" },
        { d: "add", k: "Tạo layer",     before: "—",          after: "A-GRID · màu 8 · CENTER",     n: "" },
        { d: "add", k: "Tạo layer",     before: "—",          after: "A-TEXT · màu 7 · Continuous", n: "" },
        { d: "mod", k: "Màu layer",     before: "A-WALL · 7", after: "A-WALL · 2",   n: "" },
        { d: "mod", k: "Linetype",      before: "P-PIPE · Continuous", after: "P-PIPE · DASHED", n: "" }
      ],
      warn: "profile_stale"
    },
    op_7f19: {
      endpoint: "POST /blocks/insert",
      action: "insert-block",
      origin: "Thư viện block · 09:53",
      base: "r47",
      guards: [
        { pass: true,  lbl: "Bản vẽ đích còn mở", sub: "TH-KT-01 · /docs", src: "quiescent" },
        { pass: false, lbl: "Revision khớp bản chuẩn bị",
          sub: "Chuẩn bị ở r47, bản vẽ hiện ở r48 — máy chủ đã tự huỷ thao tác này", src: "drawing_stale" }
      ],
      subjects: [{ h: "—", t: "BLOCK REF", l: "P-EQUIP" }],
      total: 1,
      diff: [{ d: "add", k: "Chèn block", before: "—", after: "VAN-CONG-DN80", n: "1 lần chèn" }],
      warn: "drawing_stale"
    }
  };

  var rowsEl  = document.getElementById("op-rows");
  var sheetEl = document.getElementById("op-sheet");
  var searchEl = document.getElementById("op-search");
  var selected = null;

  var STATE_LABEL = {
    draft: "nháp", ready: "chờ xác nhận", applying: "đang ghi",
    applied: "đã ghi", rejected: "đã bỏ", stale: "đã cũ"
  };

  function ops() { return App.staged(); }

  /* ---------- Master list ---------- */
  function paintList() {
    var q = (searchEl.value || "").trim().toLowerCase();
    var list = ops().filter(function (o) {
      return !q || (o.verb + " " + o.subject).toLowerCase().indexOf(q) > -1;
    });

    if (!list.length) {
      rowsEl.innerHTML =
        '<div class="statebox" data-state="empty">' +
          '<div class="mark">' + App.icon("changes") + "</div>" +
          "<strong>Không có thao tác nào</strong>" +
          "<p>Thao tác ghi được tạo từ Trợ lý AI, Kiểm tra, Bóc tách, Thư viện block hoặc Xuất bản.</p>" +
        "</div>";
      return;
    }

    rowsEl.innerHTML = list.map(function (o) {
      return '<button class="oprow" role="option" data-id="' + o.id + '" ' +
        'aria-selected="' + (o.id === selected ? "true" : "false") + '">' +
        '<span class="verb">' + o.verb + "</span>" +
        '<span class="subj">' + o.subject + "</span>" +
        '<span class="meta">' +
          '<span class="tag opstate" data-op="' + o.state + '">' + STATE_LABEL[o.state] + "</span>" +
          '<span class="tag tag--quiet">' + o.doc + " · " + o.rev + "</span>" +
        "</span></button>";
    }).join("");
  }

  /* ---------- Proposal sheet ---------- */
  function paintSheet() {
    var op = ops().filter(function (o) { return o.id === selected; })[0];
    if (!op) {
      sheetEl.innerHTML =
        '<div class="statebox" data-state="empty" style="padding-top:var(--s8)">' +
          '<div class="mark">' + App.icon("changes") + "</div>" +
          "<strong>Chọn một thao tác để xem đề xuất</strong>" +
          "<p>Đề xuất liệt kê đầy đủ đối tượng bị tác động trước khi bạn đồng ý. " +
          "Sau khi ghi thì không hoàn tác được.</p>" +
        "</div>";
      return;
    }

    var d = DETAIL[op.id];
    var blocked = d.guards.filter(function (g) { return !g.pass; });
    var showing = d.subjects.length;

    var guardRows = d.guards.map(function (g) {
      return '<div class="gsrow" data-pass="' + (g.pass ? "true" : "false") + '">' +
        '<span class="mk">' + App.icon("tick") + "</span>" +
        '<span class="lbl">' + g.lbl + "<small>" + g.sub + "</small></span>" +
        '<span class="src">' + g.src + "</span></div>";
    }).join("");

    var diffRows = d.diff.map(function (r) {
      return "<tr><td class=\"kind\"><span class=\"dmark\" data-d=\"" + r.d + "\">" + r.k + "</span></td>" +
        '<td class="before">' + r.before + "</td>" +
        '<td class="after">' + r.after + "</td>" +
        '<td class="mono" style="color:var(--muted)">' + (r.n || "") + "</td></tr>";
    }).join("");

    var subjRows = d.subjects.map(function (s) {
      return "<tr><td class=\"mono\">" + s.h + "</td><td class=\"mono\">" + s.t +
        "</td><td class=\"mono\">" + s.l + "</td></tr>";
    }).join("");

    var applied = op.state === "applied";
    var dead    = op.state === "stale" || blocked.length > 0;

    sheetEl.innerHTML =
      '<div class="sheetpad">' +

        /* Identity */
        '<div class="stack" style="gap:var(--s2)">' +
          '<div class="row" style="gap:var(--s2);flex-wrap:wrap">' +
            '<span class="tag opstate" data-op="' + op.state + '">' + STATE_LABEL[op.state] + "</span>" +
            '<span class="tag mono">' + op.id + "</span>" +
            '<span class="tag tag--quiet">' + d.action + "</span>" +
          "</div>" +
          '<h2 style="font-size:17px;font-weight:640;letter-spacing:-0.015em">' + op.verb + "</h2>" +
          '<div class="hint">' + op.subject + " · tạo từ " + d.origin + "</div>" +
          '<div class="mono" style="font-size:11px;color:var(--muted)">' + d.endpoint + "</div>" +
        "</div>" +

        /* Irreversibility notice — the single most important sentence here */
        '<div class="banner" data-tone="hard" data-od-id="no-undo">' +
          '<span class="bm"></span><span class="bt"><b>Không có hoàn tác.</b> ' +
          "Hệ thống không lưu nhật ký nghịch đảo và không có endpoint hoàn tác. " +
          "Sau khi ghi, cách duy nhất để quay lại là <code>UNDO</code> ngay trong AutoCAD.</span></div>" +

        /* Target */
        '<div class="panel">' +
          "<header><h2>Đích ghi</h2></header>" +
          '<div class="props" style="grid-template-columns:150px 1fr">' +
            "<dt>Bản vẽ</dt><dd>" + op.doc + "</dd>" +
            "<dt>Revision chuẩn bị</dt><dd>" + d.base + "</dd>" +
            "<dt>Revision hiện tại</dt><dd>" + DOC_REV +
              (d.base === DOC_REV ? "" : " · <span class=\"tag\">lệch</span>") + "</dd>" +
          "</div></div>" +

        /* Guards */
        '<div class="guardstrip" data-od-id="op-guards">' +
          '<div class="gs-head">Điều kiện trước khi ghi' +
            '<span class="n">' + (d.guards.length - blocked.length) + "/" + d.guards.length + " đạt</span></div>" +
          guardRows +
        "</div>" +

        /* Subjects */
        '<div class="panel" data-od-id="op-subjects">' +
          "<header><h2>Đối tượng bị tác động</h2>" +
            '<div class="actions"><span class="tag mono">' + showing + " / " + d.total + "</span></div>" +
          "</header>" +
          '<div class="tablewrap" style="max-height:220px">' +
            '<table class="data"><thead><tr><th>Handle</th><th>Kiểu</th><th>Layer</th></tr></thead>' +
            "<tbody>" + subjRows + "</tbody></table></div>" +
          (d.total > showing
            ? '<div style="padding:var(--s2) var(--s4);border-top:1px solid var(--border)" class="hint">' +
              "Hiển thị " + showing + " trong " + d.total +
              " đối tượng. Danh sách đầy đủ nằm trong payload thao tác.</div>"
            : "") +
        "</div>" +

        /* Diff */
        '<div class="panel" data-od-id="op-diff">' +
          "<header><h2>Trước → sau</h2></header>" +
          '<table class="difftable"><thead><tr><th>Thay đổi</th><th>Trước</th><th>Sau</th><th></th></tr></thead>' +
          "<tbody>" + diffRows + "</tbody></table>" +
        "</div>" +

        /* Blocked reason, or the confirm bar */
        (dead ? deadBlock(op, d, blocked) : applied ? "" : confirmBar()) +

      "</div>";

    if (!dead && !applied) wireConfirm(op, d);
    if (dead) wireDead(op, d, blocked);
  }

  function deadBlock(op, d, blocked) {
    var code = op.state === "stale" ? d.warn : (blocked[0] && blocked[0].src);
    var g = App.guards[code] || {};
    return '<div class="banner" data-tone="hard" data-od-id="op-blocked">' +
        '<span class="bm"></span>' +
        '<span class="bt"><b>' + (g.title || "Thao tác không chạy được") + "</b><br>" +
        (g.body || "") + '<br><span class="mono" style="font-size:11px;color:var(--muted)">409 · ' +
        code + "</span></span>" +
        '<span class="actions">' +
          '<button class="btn" data-reject>Bỏ thao tác</button>' +
          '<button class="btn btn--primary" data-reprepare>' + (g.cta || "Chuẩn bị lại") + "</button>" +
        "</span></div>";
  }

  function confirmBar() {
    return '<div class="panel" data-od-id="op-confirm">' +
      '<div style="padding:var(--s4);display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap">' +
        '<label class="check" style="flex:1;min-width:240px">' +
          '<input type="checkbox" id="op-ack"><span class="box">' + App.icon("tick") + "</span>" +
          '<span style="font-size:12.5px;line-height:1.45">Tôi đã đọc danh sách đối tượng và đồng ý ghi vào bản vẽ. ' +
          "<b>Thao tác này không hoàn tác được.</b></span></label>" +
        '<div class="row" style="gap:var(--s2);margin-left:auto">' +
          '<button class="btn" data-reject data-write>Bỏ qua</button>' +
          '<button class="btn btn--primary" data-apply data-write disabled>Xác nhận &amp; ghi</button>' +
        "</div>" +
      "</div></div>";
  }

  /* ---------- Actions ---------- */
  function setState(id, state) {
    var list = ops().map(function (o) {
      return o.id === id ? Object.assign({}, o, { state: state }) : o;
    });
    App.saveStaged(list);
  }

  function wireConfirm(op, d) {
    var ack = document.getElementById("op-ack");
    var apply = sheetEl.querySelector("[data-apply]");
    var reject = sheetEl.querySelector("[data-reject]");

    ack.addEventListener("change", function () { apply.disabled = !ack.checked; });

    reject.addEventListener("click", function () {
      App.confirm({
        title: "Bỏ thao tác này?",
        sub: op.verb + " · " + op.subject,
        body: '<p style="font-size:13px;color:var(--muted);margin:0">Thao tác sẽ bị gỡ khỏi hàng chờ ' +
              "(<code>POST /operations/" + op.id + "/reject</code>). Bản vẽ không thay đổi.</p>",
        confirmLabel: "Bỏ thao tác",
        cancelLabel: "Giữ lại",
        onConfirm: function () {
          setState(op.id, "rejected");
          paintList(); paintSheet();
          App.toast("Đã bỏ thao tác " + op.id);
        }
      });
    });

    apply.addEventListener("click", function () {
      apply.disabled = true;
      apply.innerHTML = '<span class="spin"></span>Đang ghi…';
      setState(op.id, "applying");
      paintList();

      /* A real apply takes 0.2–120s and can still fail after this
         point; the button therefore never navigates away. */
      setTimeout(function () {
        setState(op.id, "applied");
        paintList();
        paintSheet();
        showReport(op, d);
      }, 1400);
    });
  }

  function wireDead(op, d, blocked) {
    var reject = sheetEl.querySelector("[data-reject]");
    var re = sheetEl.querySelector("[data-reprepare]");
    if (reject) reject.addEventListener("click", function () {
      setState(op.id, "rejected"); paintList(); paintSheet();
    });
    if (re) re.addEventListener("click", function () {
      /* Never retry the same id — the server has already dropped it. */
      setState(op.id, "rejected");
      paintList(); paintSheet();
      App.toast("Đã bỏ thao tác cũ. Chuẩn bị lại từ màn hình nguồn.");
    });
  }

  /* Post-run report. /standards/apply returns applied[] + skippedIssueIds[]
     and then deletes the scan, so the only honest next step is a rescan. */
  function showReport(op, d) {
    var isStandards = d.action === "sync-layers";
    App.modal({
      title: "Đã ghi vào bản vẽ",
      sub: op.verb + " · " + op.doc + " → revision r49",
      body:
        '<div class="guardstrip">' +
          '<div class="gs-head">Kết quả</div>' +
          '<div class="gsrow" data-pass="true"><span class="mk">' + App.icon("tick") + "</span>" +
            '<span class="lbl">Đã áp dụng<small>' + d.total + " mục trong đề xuất</small></span>" +
            '<span class="src">applied[]</span></div>' +
          (isStandards
            ? '<div class="gsrow" data-pass="false"><span class="mk"></span>' +
              '<span class="lbl">Bỏ qua 1 mục<small>layer P-PIPE đang khoá — không đổi được linetype</small></span>' +
              '<span class="src">skippedIssueIds[]</span></div>'
            : "") +
        "</div>" +
        (isStandards
          ? '<div class="banner" data-tone="hard"><span class="bm"></span><span class="bt">' +
            "<b>Kết quả quét cũ đã bị huỷ.</b> Máy chủ xoá phiên quét ngay sau khi áp dụng " +
            "(<code>scans.delete</code>), nên danh sách phát hiện hiện tại không còn đúng. Phải quét lại.</span></div>"
          : ""),
      footer:
        '<span class="note">Không có hoàn tác. Muốn quay lại phải dùng <code>UNDO</code> trong AutoCAD.</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn" data-close>Đóng</button>' +
        (isStandards ? '<a class="btn btn--primary" href="review.html">Quét lại</a>' : "")
    });
  }

  /* ---------- Boot ---------- */
  rowsEl.addEventListener("click", function (e) {
    var row = e.target.closest(".oprow");
    if (!row) return;
    selected = row.dataset.id;
    paintList();
    paintSheet();
  });
  searchEl.addEventListener("input", paintList);

  selected = (ops()[0] || {}).id || null;
  paintList();
  paintSheet();
})();
</script>
</body>
</html>
