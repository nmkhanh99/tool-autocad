<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ sơ tiêu chuẩn — AutoCAD Toolkit</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .profiles { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; flex: 1; }
  .profiles > .plist { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .profiles > .peditor { min-width: 0; overflow-y: auto; }
  .prow { display: grid; gap: 5px; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); text-align: left; width: 100%; }
  .prow:hover { background: var(--fg-04); }
  .prow[aria-selected="true"] { background: var(--bg); box-shadow: inset 2px 0 0 var(--accent); }
  .prow .nm { font-size: 13px; font-weight: 590; }
  .prow .mt { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
  .editpad { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); max-width: 880px; }
  .sec > h2 { font-size: 14px; font-weight: 640; letter-spacing: -0.01em; margin-bottom: var(--s1); }
  .sec > .sd { font-size: 12.5px; color: var(--muted); margin-bottom: var(--s4); max-width: 62ch; text-wrap: pretty; }
  .sec .issuekey { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .savebar {
    position: sticky; bottom: 0; display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s5); border-top: 1px solid var(--border); background: var(--bg);
  }
  @media (max-width: 900px) { .profiles { grid-template-columns: 1fr; } .profiles > .plist { display: none; } }
</style>
</head>
<body data-screen="standards" data-acad="on" data-status="Hồ sơ cty-2024 · v12">

<div class="app">
  <header class="titlebar" data-shell="titlebar"></header>

  <div class="body">
    <nav class="rail" data-shell="rail" aria-label="Điều hướng chính"></nav>

    <main class="main">
      <div class="pagehead" data-od-id="std-head">
        <div>
          <h1 data-od-id="std-title">Hồ sơ tiêu chuẩn</h1>
          <div class="sub">Nguồn duy nhất định nghĩa thế nào là “đúng chuẩn” — Kiểm tra và Bóc tách đều đọc từ đây</div>
        </div>
        <div class="actions">
          <button class="btn" data-od-id="std-new">Hồ sơ mới</button>
        </div>
      </div>

      <div class="profiles">

        <!-- ── Profile list ──────────────────────────────────────── -->
        <div class="plist" data-od-id="profile-list">
          <div class="scroll" id="p-rows" role="listbox" aria-label="Hồ sơ tiêu chuẩn"></div>
          <div style="padding:var(--s3) var(--s4);border-top:1px solid var(--border)">
            <div class="hint">Hồ sơ đang áp dụng được dùng cho mọi lần quét mới. Đổi hồ sơ sẽ làm mọi kết quả quét đang mở hết hiệu lực.</div>
          </div>
        </div>

        <!-- ── Editor ────────────────────────────────────────────── -->
        <div class="peditor" id="p-editor"></div>
      </div>
    </main>
  </div>

  <footer class="statusbar" data-shell="statusbar"></footer>
</div>

<script src="js/app.js"></script>
<script>
/* ============================================================
   Standards profile editor — GET/POST/PUT/DELETE /standards/profiles

   Concurrency: PUT carries If-Match with the profile's ETag. A stale
   ETag returns 412 and the edit must be rebased, never force-pushed.

   Scope discipline: the engine emits exactly seven issue kinds, and
   every field below maps to one of them. Nothing in this editor
   configures a rule the engine cannot actually check.
     unit · layer-missing-<slug> · layer-properties-<slug> · dimstyle
     dim-row-x|y · frame-<handle> / frame-unmeasurable-<handle>
     mapping-required-<slug>
   ============================================================ */
(function () {
  "use strict";

  var PROFILES = [
    {
      id: "cty-2024", name: "Tiêu chuẩn công ty 2024", version: 12, etag: 'W/"p-cty2024-12"',
      active: true, updated: "09.08.2026 · 09:41", author: "khanhnm",
      insunits: "4", insunitsLabel: "Millimeters",
      layers: [
        { slug: "a-wall", name: "A-WALL", color: "2",  ltype: "Continuous", lw: "0.35", req: true },
        { slug: "a-door", name: "A-DOOR", color: "3",  ltype: "Continuous", lw: "0.25", req: true },
        { slug: "a-grid", name: "A-GRID", color: "8",  ltype: "CENTER",     lw: "0.13", req: true },
        { slug: "a-text", name: "A-TEXT", color: "7",  ltype: "Continuous", lw: "0.18", req: true },
        { slug: "p-pipe", name: "P-PIPE", color: "5",  ltype: "DASHED",     lw: "0.35", req: false }
      ],
      dimStyle: "CTY-DIM-100", dimRowX: "8.0", dimRowY: "8.0",
      frames: [
        { code: "A1", w: "841", h: "594" },
        { code: "A2", w: "594", h: "420" },
        { code: "A3", w: "420", h: "297" }
      ],
      mappings: [
        { from: "TUONG*", to: "A-WALL" },
        { from: "CUA*",   to: "A-DOOR" },
        { from: "ONG-*",  to: "P-PIPE" }
      ]
    },
    {
      id: "cty-2019", name: "Tiêu chuẩn công ty 2019 (kế thừa)", version: 4, etag: 'W/"p-cty2019-4"',
      active: false, updated: "12.03.2024 · 16:20", author: "hoand",
      insunits: "4", insunitsLabel: "Millimeters",
      layers: [
        { slug: "tuong",  name: "TUONG", color: "2", ltype: "Continuous", lw: "0.35", req: true },
        { slug: "cua",    name: "CUA",   color: "3", ltype: "Continuous", lw: "0.25", req: true }
      ],
      dimStyle: "ISO-25", dimRowX: "7.0", dimRowY: "7.0",
      frames: [{ code: "A1", w: "841", h: "594" }],
      mappings: []
    },
    {
      id: "iso-mep", name: "ISO — bộ môn cơ điện", version: 2, etag: 'W/"p-isomep-2"',
      active: false, updated: "28.06.2026 · 11:05", author: "khanhnm",
      insunits: "4", insunitsLabel: "Millimeters",
      layers: [
        { slug: "p-pipe", name: "P-PIPE", color: "5", ltype: "DASHED", lw: "0.35", req: true },
        { slug: "dccd",   name: "DCCD",   color: "4", ltype: "Continuous", lw: "0.25", req: true }
      ],
      dimStyle: "ISO-25", dimRowX: "10.0", dimRowY: "10.0",
      frames: [{ code: "A1", w: "841", h: "594" }],
      mappings: [{ from: "PIPE*", to: "P-PIPE" }]
    }
  ];

  var listEl = document.getElementById("p-rows");
  var edEl   = document.getElementById("p-editor");
  var sel    = "cty-2024";
  var dirty  = false;

  function current() { return PROFILES.filter(function (p) { return p.id === sel; })[0]; }

  function paintList() {
    listEl.innerHTML = PROFILES.map(function (p) {
      return '<button class="prow" role="option" data-id="' + p.id + '" ' +
        'aria-selected="' + (p.id === sel ? "true" : "false") + '">' +
        '<span class="nm">' + p.name + "</span>" +
        '<span class="mt">' +
          (p.active ? '<span class="tag tag--accent">đang áp dụng</span>' : "") +
          '<span class="tag mono">v' + p.version + "</span>" +
          '<span class="tag tag--quiet">' + p.layers.length + " layer</span>" +
        "</span></button>";
    }).join("");
  }

  function layerRows(p) {
    return p.layers.map(function (l, i) {
      return "<tr data-i=\"" + i + "\">" +
        '<td><input class="input mono" value="' + l.name + '" aria-label="Tên layer" style="height:26px"></td>' +
        '<td class="n"><input class="input mono" value="' + l.color + '" aria-label="Màu" style="height:26px;width:64px;text-align:right"></td>' +
        '<td><input class="input mono" value="' + l.ltype + '" aria-label="Linetype" style="height:26px"></td>' +
        '<td class="n"><input class="input mono" value="' + l.lw + '" aria-label="Lineweight" style="height:26px;width:72px;text-align:right"></td>' +
        '<td style="text-align:center"><label class="check"><input type="checkbox"' + (l.req ? " checked" : "") +
          '><span class="box">' + App.icon("tick") + "</span></label></td>" +
        '<td class="mono" style="color:var(--muted);font-size:10.5px">layer-missing-' + l.slug + "</td>" +
        '<td style="text-align:right"><button class="btn btn--quiet btn--icon" data-del-layer="' + i +
          '" aria-label="Xoá layer">' + App.icon("close") + "</button></td></tr>";
    }).join("");
  }

  function paintEditor() {
    var p = current();
    if (!p) return;

    edEl.innerHTML =
      '<div class="editpad">' +

        /* Header */
        '<div class="stack" style="gap:var(--s2)">' +
          '<div class="row" style="gap:var(--s2);flex-wrap:wrap">' +
            '<span class="tag mono">' + p.id + "</span>" +
            '<span class="tag mono">v' + p.version + "</span>" +
            (p.active ? '<span class="tag tag--accent">đang áp dụng</span>' : "") +
          "</div>" +
          '<h2 style="font-size:17px;font-weight:640;letter-spacing:-0.015em">' + p.name + "</h2>" +
          '<div class="hint">Sửa lần cuối ' + p.updated + " bởi " + p.author +
            ' · <span class="mono">If-Match: ' + p.etag + "</span></div>" +
        "</div>" +

        /* Editing a live profile invalidates every scan already taken with it */
        (p.active
          ? '<div class="banner"><span class="bm"></span><span class="bt">' +
            "Hồ sơ này đang được dùng để quét. Lưu thay đổi sẽ nâng lên <b>v" + (p.version + 1) + "</b> " +
            "và mọi kết quả quét đang mở sẽ trả <code>profile_stale</code> khi áp dụng — người dùng phải quét lại." +
            "</span></div>"
          : "") +

        /* 1 — Units */
        '<section class="sec" data-od-id="sec-units">' +
          "<h2>Đơn vị bản vẽ</h2>" +
          '<div class="sd">Quy tắc <span class="issuekey">unit</span> so INSUNITS của bản vẽ với giá trị dưới đây. ' +
          'Sửa được bằng nhóm <span class="issuekey">apply-units</span>.</div>' +
          '<div class="formgrid">' +
            '<div class="lb">INSUNITS bắt buộc<small>Mã hệ đơn vị chèn của AutoCAD</small></div>' +
            '<div class="fd"><div class="row">' +
              '<select class="select" style="width:220px" aria-label="INSUNITS">' +
                '<option value="4"' + (p.insunits === "4" ? " selected" : "") + ">4 — Millimeters</option>" +
                '<option value="5"' + (p.insunits === "5" ? " selected" : "") + ">5 — Centimeters</option>" +
                '<option value="6"' + (p.insunits === "6" ? " selected" : "") + ">6 — Meters</option>" +
              "</select>" +
              '<span class="hint">Engine xếp lệch đơn vị ở mức <b>cảnh báo</b>, không phải lỗi.</span>' +
            "</div></div>" +
          "</div>" +
        "</section>" +

        /* 2 — Layers */
        '<section class="sec" data-od-id="sec-layers">' +
          "<h2>Layer bắt buộc &amp; thuộc tính</h2>" +
          '<div class="sd">Sinh ra hai loại phát hiện: <span class="issuekey">layer-missing-&lt;slug&gt;</span> khi thiếu layer, ' +
          'và <span class="issuekey">layer-properties-&lt;slug&gt;</span> khi màu / linetype / lineweight lệch. ' +
          'Nhóm sửa <span class="issuekey">sync-layers</span> chỉ <b>tạo layer và sửa thuộc tính</b> — không đổi tên layer sẵn có.</div>' +
          '<div class="panel"><div class="tablewrap">' +
            '<table class="data"><thead><tr>' +
              "<th>Tên layer</th><th class=\"n\">Màu</th><th>Linetype</th><th class=\"n\">Lineweight</th>" +
              "<th style=\"text-align:center\">Bắt buộc</th><th>Mã phát hiện</th><th></th>" +
            "</tr></thead><tbody>" + layerRows(p) + "</tbody></table>" +
          "</div>" +
          '<div style="padding:var(--s2) var(--s3);border-top:1px solid var(--border)">' +
            '<button class="btn btn--quiet" data-add-layer>' + App.icon("plus") + "Thêm layer</button></div>" +
          "</div>" +
        "</section>" +

        /* 3 — Dimensions */
        '<section class="sec" data-od-id="sec-dim">' +
          "<h2>Kích thước</h2>" +
          '<div class="sd">Tên dimstyle ở đây là <b>nguồn duy nhất</b> — không màn hình nào được ghi cứng tên style. ' +
          'Phát hiện: <span class="issuekey">dimstyle</span>, <span class="issuekey">dim-row-x</span>, ' +
          '<span class="issuekey">dim-row-y</span>.</div>' +
          '<div class="formgrid">' +
            '<div class="lb">Tên dimension style</div>' +
            '<div class="fd"><input class="input mono" value="' + p.dimStyle + '" style="max-width:280px" aria-label="Dimension style"></div>' +
            '<div class="lb">Bước hàng DIM theo X<small>đơn vị bản vẽ</small></div>' +
            '<div class="fd"><input class="input mono" value="' + p.dimRowX + '" style="max-width:140px" aria-label="Bước hàng X"></div>' +
            '<div class="lb">Bước hàng DIM theo Y<small>đơn vị bản vẽ</small></div>' +
            '<div class="fd"><input class="input mono" value="' + p.dimRowY + '" style="max-width:140px" aria-label="Bước hàng Y"></div>' +
          "</div>" +
          '<div class="banner" style="margin-top:var(--s3)"><span class="bm"></span><span class="bt">' +
            "Nhóm sửa <code>dimspace</code> <b>bắt buộc có DIM gốc</b> để căn theo. Khi áp dụng, " +
            "Kiểm tra sẽ yêu cầu chọn một dimension làm chuẩn hàng — thiếu nó thì lệnh ném lỗi.</span></div>" +
        "</section>" +

        /* 4 — Sheet frames */
        '<section class="sec" data-od-id="sec-frame">' +
          "<h2>Khổ khung tên</h2>" +
          '<div class="sd">Phát hiện <span class="issuekey">frame-&lt;handle&gt;</span> khi khung sai khổ, và ' +
          '<span class="issuekey">frame-unmeasurable-&lt;handle&gt;</span> khi không đo được khung — ' +
          "đây là <b>nguồn phát hiện mức “gợi ý” duy nhất</b> của cả engine. Sửa bằng <span class=\"issuekey\">resize-frame</span>.</div>" +
          '<div class="panel"><div class="tablewrap"><table class="data">' +
            "<thead><tr><th>Khổ</th><th class=\"n\">Rộng (mm)</th><th class=\"n\">Cao (mm)</th><th></th></tr></thead><tbody>" +
            p.frames.map(function (f, i) {
              return "<tr><td class=\"mono\">" + f.code + '</td><td class="n mono">' + f.w +
                '</td><td class="n mono">' + f.h + '</td><td style="text-align:right">' +
                '<button class="btn btn--quiet btn--icon" data-del-frame="' + i + '" aria-label="Xoá khổ">' +
                App.icon("close") + "</button></td></tr>";
            }).join("") +
          "</tbody></table></div></div>" +
        "</section>" +

        /* 5 — Layer name mapping */
        '<section class="sec" data-od-id="sec-mapping">' +
          "<h2>Ánh xạ tên layer cũ</h2>" +
          '<div class="sd">Phát hiện <span class="issuekey">mapping-required-&lt;slug&gt;</span> ở mức <b>lỗi</b>. ' +
          "Không có nhóm sửa tự động: <code>sync-layers</code> chỉ tạo layer mới chứ không đổi tên layer cũ, " +
          "nên việc gán lại đối tượng phải đi qua thao tác có xác nhận trong <b>Thay đổi</b>.</div>" +
          '<div class="panel"><div class="tablewrap"><table class="data">' +
            "<thead><tr><th>Tên trong bản vẽ</th><th>Ánh xạ về</th><th></th></tr></thead><tbody>" +
            (p.mappings.length
              ? p.mappings.map(function (m, i) {
                  return "<tr><td class=\"mono\">" + m.from + '</td><td class="mono">' + m.to +
                    '</td><td style="text-align:right"><button class="btn btn--quiet btn--icon" data-del-map="' + i +
                    '" aria-label="Xoá ánh xạ">' + App.icon("close") + "</button></td></tr>";
                }).join("")
              : '<tr><td colspan="3" class="hint" style="padding:var(--s4)">Chưa có ánh xạ nào.</td></tr>') +
          "</tbody></table></div></div>" +
        "</section>" +

        (p.active ? "" :
          '<section class="sec">' +
            '<div class="banner"><span class="bm"></span><span class="bt">Hồ sơ này chưa được áp dụng. ' +
            "Chọn “Đặt làm hồ sơ áp dụng” để mọi lần quét mới dùng nó.</span>" +
            '<span class="actions"><button class="btn" data-activate>Đặt làm hồ sơ áp dụng</button></span></div>' +
          "</section>") +

      "</div>" +

      /* Save bar */
      '<div class="savebar">' +
        '<span class="hint" id="p-dirty">Chưa có thay đổi chưa lưu</span>' +
        '<span style="margin-left:auto"></span>' +
        '<button class="btn" data-revert>Hoàn nguyên</button>' +
        '<button class="btn btn--primary" data-save data-write>Lưu hồ sơ</button>' +
      "</div>";

    wireEditor(p);
  }

  function markDirty() {
    dirty = true;
    var el = document.getElementById("p-dirty");
    if (el) el.textContent = "Có thay đổi chưa lưu";
  }

  function wireEditor(p) {
    edEl.querySelectorAll("input, select").forEach(function (f) {
      f.addEventListener("input", markDirty);
      f.addEventListener("change", markDirty);
    });

    var add = edEl.querySelector("[data-add-layer]");
    if (add) add.addEventListener("click", function () {
      p.layers.push({ slug: "layer-" + (p.layers.length + 1), name: "", color: "7",
        ltype: "Continuous", lw: "0.25", req: true });
      paintEditor(); markDirty();
    });

    edEl.addEventListener("click", function (e) {
      var d = e.target.closest("[data-del-layer]");
      if (d) { p.layers.splice(+d.dataset.delLayer, 1); paintEditor(); markDirty(); }
      var f = e.target.closest("[data-del-frame]");
      if (f) { p.frames.splice(+f.dataset.delFrame, 1); paintEditor(); markDirty(); }
      var m = e.target.closest("[data-del-map]");
      if (m) { p.mappings.splice(+m.dataset.delMap, 1); paintEditor(); markDirty(); }
    });

    var act = edEl.querySelector("[data-activate]");
    if (act) act.addEventListener("click", function () {
      App.confirm({
        title: "Đổi hồ sơ đang áp dụng?",
        sub: "Sang " + p.name,
        body: '<p style="margin:0;font-size:13px;color:var(--muted)">Mọi kết quả quét đang mở sẽ hết hiệu lực ' +
              "và trả <code>profile_stale</code> khi áp dụng. Người dùng sẽ phải quét lại bản vẽ.</p>",
        confirmLabel: "Đổi hồ sơ",
        onConfirm: function () {
          PROFILES.forEach(function (x) { x.active = x.id === p.id; });
          paintList(); paintEditor();
          App.toast("Hồ sơ áp dụng: " + p.name);
        }
      });
    });

    edEl.querySelector("[data-revert]").addEventListener("click", function () {
      dirty = false; paintEditor();
    });

    edEl.querySelector("[data-save]").addEventListener("click", function () {
      var btn = this;
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span>Đang lưu…';

      setTimeout(function () {
        btn.disabled = false;
        btn.textContent = "Lưu hồ sơ";

        /* The 2019 profile is deliberately stale here so the mockup
           shows what an If-Match rejection actually looks like. */
        if (p.id === "cty-2019") { showConflict(p); return; }

        p.version += 1;
        p.etag = 'W/"p-' + p.id.replace(/-/g, "") + "-" + p.version + '"';
        dirty = false;
        paintList(); paintEditor();
        App.toast("Đã lưu " + p.name + " · v" + p.version);
      }, 1100);
    });
  }

  function showConflict(p) {
    App.modal({
      title: "Hồ sơ đã bị người khác sửa",
      sub: "PUT /standards/profiles/" + p.id + " · 412 Precondition Failed",
      body:
        '<div class="statebox" data-state="blocked" style="padding:var(--s3) 0">' +
          '<div class="mark">' + App.icon("alert") + "</div>" +
          "<p>Bạn mở hồ sơ ở <b>v" + p.version + "</b> nhưng máy chủ đang giữ <b>v" + (p.version + 1) +
          "</b>. Ghi đè sẽ xoá mất thay đổi của người kia, nên máy chủ từ chối.</p>" +
          '<span class="code">If-Match: ' + p.etag + " · máy chủ: W/&quot;p-cty2019-" + (p.version + 1) + "&quot;</span>" +
        "</div>",
      footer:
        '<span class="note">Không có ghi đè cưỡng bức. Phải nạp bản mới rồi sửa lại.</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn" data-close>Đóng</button>' +
        '<button class="btn btn--primary" data-close>Nạp bản mới nhất</button>'
    });
  }

  listEl.addEventListener("click", function (e) {
    var row = e.target.closest(".prow");
    if (!row || row.dataset.id === sel) return;
    if (dirty && !window.confirm("Bỏ thay đổi chưa lưu?")) return;
    sel = row.dataset.id; dirty = false;
    paintList(); paintEditor();
  });

  paintList();
  paintEditor();
})();
</script>
</body>
</html>
